name: Bug report
description: Uygulamadaki bir hatayı bildirin
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Hatayı hızlı inceleyebilmemiz için lütfen alanları mümkün olduğunca net doldurun.
  - type: input
    id: version
    attributes:
      label: Uygulama sürümü
      description: "Örnek: 1.0.9"
      placeholder: "1.0.9"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: İşletim sistemi
      description: Windows sürümü ve mimari bilgisi
      placeholder: "Windows 11 x64"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Hata özeti
      description: Ne oldu?
      placeholder: "Video önizleme açılmıyor..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Yeniden üretme adımları
      description: Hatayı nasıl tekrar oluşturabiliriz?
      placeholder: |
        1. Uygulamayı aç
        2. URL gir
        3. Önizleme butonuna bas
        4. Hata görünür
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Beklenen davranis
      placeholder: "Video önizlemesi başlamalıydı."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Gerçek davranış
      placeholder: "Önizleme alanı boş kalıyor."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log veya ekran görüntüsü
      description: Varsa hata mesajı, konsol çıktısı veya ekran görüntüsü ekleyin.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Kontrol listesi
      options:
        - label: Aynı sorun için mevcut issue'ları kontrol ettim.
          required: true
        - label: Bu rapor yalnızca kullanma hakkım olan içeriklerle ilgilidir.
          required: true
