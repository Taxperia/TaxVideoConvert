name: Feature request
description: Yeni özellik veya iyileştirme önerisi
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Çözülmek istenen problem
      description: Bu özellik hangi ihtiyacı karşılayacak?
      placeholder: "Dışarı aktarma ayarlarında..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Önerilen çözüm
      description: Nasıl çalışmasını istiyorsunuz?
      placeholder: "Ayarlar paneline..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatifler
      description: Düşündüğünüz başka çözümler varsa yazın.
  - type: dropdown
    id: area
    attributes:
      label: Etkilenen alan
      options:
        - Video preview
        - Editor
        - Export
        - Settings
        - Installer / updater
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Kontrol listesi
      options:
        - label: Benzer bir özellik isteği olup olmadığını kontrol ettim.
          required: true
        - label: Öneri, başkalarının haklarını ihlal edecek kullanımları teşvik etmiyor.
          required: true
