name: Support question
description: Kurulum, kullanım veya build hakkında soru sorun
title: "[Question]: "
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: Sorunuz
      description: Neyi yapmaya çalışıyorsunuz?
      placeholder: "Release nasıl çıkartılır?"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Uygulama sürümü
      placeholder: "1.0.9"
  - type: textarea
    id: context
    attributes:
      label: Ek bilgi
      description: Komut çıktısı, ekran görüntüsü veya ilgili dosya bilgisi ekleyebilirsiniz.
      render: text
